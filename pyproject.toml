[project]
name = "customer-service-data-analyst-agent"
version = "0.1.0"
description = "AI agent for customer service data analysis."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "datasets>=3.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
